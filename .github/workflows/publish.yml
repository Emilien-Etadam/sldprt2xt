# Publication sur PyPI par confiance d'éditeur (« trusted publishing ») :
# PyPI reconnaît ce dépôt et ce workflow, aucun jeton n'existe nulle part.
# Se déclenche sur un tag v* — pousser v1.1.0 publie 1.1.0.
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: construire
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*
      - name: le wheel s'installe et la commande répond
        run: |
          python -m pip install --quiet dist/*.whl
          sldprt2xt --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # C'est ce jeton d'identité éphémère que PyPI vérifie — rien à stocker.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
